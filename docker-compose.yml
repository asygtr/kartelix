services:
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    volumes:
      - ./database:/app/database
      - ./xls:/app/xls
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
