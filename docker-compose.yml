services:
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    volumes:
      - ./database:/app/database
      - ./xls:/app/xls
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5000}
